; PlatformIO project for the mesh node firmware: src/ is the board application, lib/lmesh/ is the portable
; protocol library (found automatically). The host simulator and unit tests build with CMake, not here.
; One environment per radio driver and chip, named <radio>_<chip>: each radio is a folder under src/radio/, each chip
; a folder under src/mcu/, and the filter keeps only that pair. Both boards take the same wiring (see include/board.h).
; tools/flash.py reads which chip the attached ST-LINK sees and flashes the matching environment.
[platformio]
default_envs = rylr999_l476

[env]
platform = ststm32
framework = stm32cube
; Placeholders so [env] resolves on its own; every environment sets these through its mcu_ and radio_ sections.
custom_mcu = f446
custom_radio = none
custom_radio_flags =
build_src_filter = +<*> -<radio/> -<mcu/> +<radio/${this.custom_radio}/> +<mcu/${this.custom_mcu}/>
build_flags = -Wall -Wextra -Wshadow -I include -Isrc/mcu/${this.custom_mcu} ${this.custom_radio_flags}
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_eol = LF

; Chips

[mcu_f446]
board = nucleo_f446re
custom_mcu = f446
; Flash sectors 5 to 7 (0x08020000 up, 384 KB) hold the storage log; keep the program in sectors 0 to 4 below it.
board_upload.maximum_size = 131072

[mcu_l476]
board = nucleo_l476rg
custom_mcu = l476
; The top 128 KB of flash (0x080E0000 up) holds the storage log; keep the program below it.
board_upload.maximum_size = 917504

; Radios

; SF9 and the slower beacons match the RF study's delivery runs (insights, build h60s600). Status is 590 s so period
; plus jitter stays inside the 600 s identification interval. Every radio uses these; keep them the same on all nodes.
[mesh]
timers = -DLMESH_HELLO_PERIOD_MS=60000 -DLMESH_ROUTE_HOLD_MS=210000
  -DLMESH_STATUS_PERIOD_MS=590000 -DLMESH_STATUS_JITTER_MS=10000 -DLMESH_NODE_STALE_MS=1500000

[radio_rylr999]
custom_radio = rylr999
custom_radio_flags = -DRYLR999_SF=9 ${mesh.timers}

; The 433 MHz REYAX module, at the RF study's SF9 by default.
[radio_rylr498]
custom_radio = rylr498
custom_radio_flags = ${mesh.timers}

[radio_lr1121]
custom_radio = lr1121
custom_radio_flags = ${mesh.timers}

[radio_none]
custom_radio = none
custom_radio_flags =

; Environments

[env:rylr999_f446]
extends = mcu_f446, radio_rylr999

[env:rylr999_l476]
extends = mcu_l476, radio_rylr999

[env:rylr498_f446]
extends = mcu_f446, radio_rylr498

[env:rylr498_l476]
extends = mcu_l476, radio_rylr498

[env:lr1121_f446]
extends = mcu_f446, radio_lr1121

[env:lr1121_l476]
extends = mcu_l476, radio_lr1121

[env:none_f446]
extends = mcu_f446, radio_none

[env:none_l476]
extends = mcu_l476, radio_none
