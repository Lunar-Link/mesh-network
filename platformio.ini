; PlatformIO project for the mesh node firmware: src/ is the board application, lib/lmesh/ is the portable
; protocol library (found automatically). The host simulator and unit tests build with CMake, not here.
; One environment per radio driver; each driver is a folder under src/radio/ and the filter keeps only that one.
[platformio]
default_envs = rylr999

[env]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube
; The top 128 KB of flash (0x080E0000 up) holds the storage log; keep the program below it.
board_upload.maximum_size = 917504
build_flags = -Wall -Wextra -Wshadow
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_eol = LF

[env:rylr999]
build_src_filter = +<*> -<radio/> +<radio/rylr999/>
; SF9 and the slower beacons match the RF study's delivery runs (insights, build h60s600). Status is 590 s so
; period plus jitter stays inside the 600 s identification interval.
build_flags = ${env.build_flags} -DRYLR999_SF=9
  -DLMESH_HELLO_PERIOD_MS=60000 -DLMESH_ROUTE_HOLD_MS=210000
  -DLMESH_STATUS_PERIOD_MS=590000 -DLMESH_STATUS_JITTER_MS=10000 -DLMESH_NODE_STALE_MS=1500000

[env:lr1121]
build_src_filter = +<*> -<radio/> +<radio/lr1121/>
; Same mesh timers as the study's delivery runs; keep these in step with env:rylr999.
build_flags = ${env.build_flags}
  -DLMESH_HELLO_PERIOD_MS=60000 -DLMESH_ROUTE_HOLD_MS=210000
  -DLMESH_STATUS_PERIOD_MS=590000 -DLMESH_STATUS_JITTER_MS=10000 -DLMESH_NODE_STALE_MS=1500000

[env:none]
build_src_filter = +<*> -<radio/> +<radio/none/>
